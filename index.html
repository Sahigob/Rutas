<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Organizador de Rutas Ana</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
<style>
:root {
    --primary: #516ced;
    --primary-dark: #3158e8;
    --primary-glow: rgba(81,108,237,.28);
    --bg: #050914;
    --bg-2: #070b15;
    --card-bg: rgba(11,17,31,.88);
    --card-2: rgba(15,23,42,.82);
    --text: #f3f6ff;
    --muted: #8f9bb3;
    --border: #1c2940;
    --success: #35c759;
    --warning: #f59e0b;
    --danger: #ef5350;
    --shadow: 0 14px 35px rgba(0,0,0,.28);
}

* { box-sizing: border-box; }

html, body {
    background:
        radial-gradient(circle at 50% -10%, rgba(81,108,237,.18), transparent 38%),
        radial-gradient(circle at 100% 20%, rgba(49,88,232,.08), transparent 30%),
        var(--bg);
}

body {
    margin:0;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display:flex;
    flex-direction:row;
    height:100vh;
    background:
        radial-gradient(circle at 50% -10%, rgba(81,108,237,.18), transparent 38%),
        linear-gradient(180deg, var(--bg-2), var(--bg));
    color:var(--text);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
}

#rotation-notice {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:rgba(15,20,35,.94);
    color:var(--text);
    text-align:center;
    padding:12px;
    z-index:9999;
    font-weight:800;
    font-size:14px;
    letter-spacing:.03em;
    border-bottom:1px solid var(--border);
    box-shadow:0 8px 24px rgba(0,0,0,.35);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
}

#map {
    flex:1;
    height:100%;
    z-index:1;
    background:#060a13;
}

#panel {
    width:400px;
    padding:20px;
    overflow-y:auto;
    background:rgba(7,11,21,.94);
    border-left:1px solid var(--border);
    box-shadow:-14px 0 35px rgba(0,0,0,.28);
    z-index:10;
    scrollbar-width:thin;
    scrollbar-color:#263657 transparent;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
}

#panel::-webkit-scrollbar { width:6px; }
#panel::-webkit-scrollbar-track { background:transparent; }
#panel::-webkit-scrollbar-thumb { background:#263657; border-radius:10px; }

h3 {
    margin:20px 0 12px 0;
    font-size:.82rem;
    font-weight:950;
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--text);
    text-transform:uppercase;
    letter-spacing:.06em;
    font-style:italic;
}

h3::before {
    content:'';
    width:4px;
    height:18px;
    background:linear-gradient(180deg,#516ced,#3158e8);
    border-radius:4px;
    box-shadow:0 0 12px rgba(81,108,237,.55);
}

.card {
    position:relative;
    overflow:hidden;
    background:linear-gradient(145deg,rgba(15,23,42,.92),rgba(8,13,25,.9));
    border:1px solid var(--border);
    border-radius:18px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
}

.card::before {
    content:'';
    position:absolute;
    top:0;
    left:12%;
    right:12%;
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(81,108,237,.65),transparent);
    opacity:.8;
}

button {
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.08);
    background:linear-gradient(135deg,#516ced 0%,#3158e8 100%);
    color:white;
    font-weight:850;
    cursor:pointer;
    font-size:13px;
    letter-spacing:.045em;
    transition:all .2s ease;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    box-shadow:0 8px 20px rgba(49,88,232,.22);
    -webkit-tap-highlight-color:transparent;
}

button:hover {
    background:linear-gradient(135deg,#6079f0 0%,#4165e9 100%);
    transform:translateY(-1px);
    box-shadow:0 10px 24px rgba(49,88,232,.3);
}

button:active {
    transform:translateY(1px);
}

.btn-google-helper {
    background:linear-gradient(135deg,#3158e8,#516ced);
    font-size:11px;
    padding:9px;
    margin-top:4px;
}

.btn-register {
    background:linear-gradient(135deg,#35c759,#25a947);
    box-shadow:0 8px 20px rgba(53,199,89,.18);
}

#btnRutaOrdenEstricto {
    background:linear-gradient(135deg,#f59e0b,#d97706);
    color:white;
    box-shadow:0 8px 20px rgba(245,158,11,.18);
}

.smallBtn {
    padding:7px 12px;
    font-size:11px;
    margin:4px 2px;
    width:auto;
    display:inline-flex;
    border-radius:9px;
}

.deleteBtn {
    background:linear-gradient(135deg,#ef5350,#d83e3b);
    box-shadow:0 6px 16px rgba(239,83,80,.16);
}

.saveBtn {
    background:linear-gradient(135deg,#35c759,#25a947);
    box-shadow:0 6px 16px rgba(53,199,89,.16);
}

input, select, textarea {
    width:100%;
    margin:8px 0;
    padding:11px;
    border-radius:11px;
    border:1px solid #1c2940;
    box-sizing:border-box;
    font-size:14px;
    font-family:inherit;
    color:var(--text);
    background:rgba(5,9,20,.78);
    outline:none;
    transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
}

input::placeholder, textarea::placeholder {
    color:#68758e;
}

input:focus, select:focus, textarea:focus {
    border-color:#516ced;
    background:rgba(8,14,28,.95);
    box-shadow:0 0 0 3px rgba(81,108,237,.12),0 0 18px rgba(81,108,237,.08);
}

select option {
    background:#0b111f;
    color:#f3f6ff;
}

.coord-container {
    background:rgba(245,158,11,.07);
    border:1px solid rgba(245,158,11,.25);
    padding:10px;
    border-radius:12px;
    margin-top:10px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
}

.coord-container small {
    color:#f5b84c !important;
    font-weight:800;
}

.coord-row {
    display:flex;
    gap:8px;
    margin-top:5px;
}

.coord-row input {
    margin:0;
    background:rgba(5,9,20,.82);
    border:1px solid rgba(245,158,11,.35);
    color:#f3f6ff;
    font-family:monospace;
    text-align:center;
}

.client {
    padding:12px;
    border:1px solid var(--border);
    background:linear-gradient(145deg,rgba(15,23,42,.78),rgba(8,13,25,.76));
    margin-bottom:10px;
    border-radius:14px;
    box-shadow:0 8px 22px rgba(0,0,0,.18);
}

.edit-mode {
    border:2px solid var(--primary);
    background:rgba(81,108,237,.09);
    box-shadow:0 0 0 1px rgba(81,108,237,.12),0 12px 28px rgba(0,0,0,.25);
}

.stats-badge {
    background:linear-gradient(135deg,#516ced,#3158e8);
    color:white;
    padding:3px 10px;
    border-radius:20px;
    font-size:.72rem;
    margin-left:auto;
    box-shadow:0 5px 14px rgba(49,88,232,.25);
}

input[type="checkbox"] {
    width:auto;
    accent-color:var(--primary);
    transform:scale(1.2);
    margin-right:12px;
    cursor:pointer;
}

.routeItem {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    font-size:12px;
    color:#cbd5e1;
    background:rgba(5,9,20,.72);
    padding:8px 12px;
    border-radius:11px;
    border:1px solid var(--border);
}

.hidden { display:none; }

.marker-label {
    background:#0b111f;
    border:2px solid #ef5350;
    border-radius:50%;
    width:20px;
    height:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:950;
    font-size:12px;
    color:#ef5350;
    box-shadow:0 0 12px rgba(239,83,80,.3);
}

@media (max-width:768px) {
    body { flex-direction:row !important; }
    #panel {
        width:85%;
        max-width:320px;
        padding:15px;
    }
    @media (orientation:portrait) {
        #rotation-notice { display:block; }
        body { padding-top:45px; }
    }
}


/* ===== PESTAÑAS DESPLEGABLES ===== */

    width: 430px;

}

.accordion-tab {

}

.accordion-header {
    width: 100%;
    min-height: 54px;
    margin: 0;
    padding: 12px 14px;
    border: 0;
    border-radius: 15px;
    background: transparent;
    color: var(--text);
    justify-content: space-between;
    text-align: left;
    box-shadow: none;
}

.accordion-header:hover {
    background: rgba(81,108,237,.08);
    transform: none;
    box-shadow: none;
}

.accordion-title {
    display: flex;
    align-items: center;
    gap: 10px;

.accordion-tab.open .accordion-arrow {

@media (max-width: 768px) {
    #panel {
        width: 92%;
        max-width: 390px;

<script>
document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".accordion-header").forEach(function (header) {
        header.addEventListener("click", function () {
            var tab = header.parentElement;
            var open = tab.classList.contains("open");
            tab.classList.toggle("open", !open);
            header.setAttribute("aria-expanded", String(!open));
        });
    });
});
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, where, getDoc } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-auth.js";

const firebaseConfig = { apiKey: "AIzaSyByi9lTT4kN4YbD8cneKLmTm05RzCAgPhI", authDomain: "organizador-de-visitas-f10ad.firebaseapp.com", projectId: "organizador-de-visitas-f10ad", storageBucket: "organizador-de-visitas-f10ad.firebasestorage.app", messagingSenderId: "737024476908", appId: "1:737024476908:web:09cf2cc99ac0b7352f07c9" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let clients=[], markers=[], redMarkers=[], routeLine, lastRouteCoords=[], lastRouteClients=[], editingClientId = null, currentStartOption = "gps";

const iconNormal = new L.Icon({ iconUrl:"https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png", shadowUrl:"https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png", iconSize:[25,41], iconAnchor:[12,41] });
const iconFood = new L.Icon({ iconUrl:"https://cdn-icons-png.flaticon.com/512/3448/3448609.png", iconSize:[38,38], iconAnchor:[19,38] });
const iconHotel = new L.Icon({ iconUrl: "data:image/svg+xml;base64," + btoa(`<svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 38 38"><circle cx="19" cy="19" r="18" fill="#ff9900" stroke="white" stroke-width="2"/><text x="50%" y="55%" font-size="18" text-anchor="middle" fill="black" font-family="Arial" font-weight="bold" dominant-baseline="middle">H</text></svg>`), iconSize:[38,38], iconAnchor:[19,38] });
const iconPin = new L.Icon({ iconUrl:"https://cdn-icons-png.flaticon.com/512/684/684908.png", iconSize:[32,32], iconAnchor:[16,32] });
const iconUser = new L.Icon({ iconUrl:"https://cdn-icons-png.flaticon.com/512/684/684908.png", iconSize:[40,40], iconAnchor:[20,40] });

function getClientIcon(cliente){
  const text=(cliente.notes||"").toLowerCase();
  if(text.includes("comida")||text.includes("bar")||text.includes("restaurante")) return iconFood;
  if(text.includes("hotel")||text.includes("hostal")||text.includes("dormir")) return iconHotel;
  return iconNormal;
}

let map;
function initMap() {
    if (map) return;
    map = L.map('map').setView([40.4168,-3.7038],12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
}
initMap();

onAuthStateChanged(auth, (user) => {
    if (user) {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('mainSection').classList.remove('hidden');
        document.getElementById('userDisplay').innerText = user.email;
        cargarClientes(); cargarRutas(); showUserPosition();
    } else {
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('mainSection').classList.add('hidden');
    }
});

async function geocode(addr){ 
    try {
        let res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr)}`); 
        let data=await res.json(); return data.length>0 ? {lat:parseFloat(data[0].lat), lng:parseFloat(data[0].lon)} : null; 
    } catch(e) { return null; }
}

async function cargarClientes(){ 
    if(!auth.currentUser) return;
    const q = query(collection(db, "clientes"), where("userId", "==", auth.currentUser.uid));
    const snapshot = await getDocs(q); clients = snapshot.docs.map(d=>({...d.data(),id:d.id})).filter(c=>c.name); 
    clients.sort((a,b)=>a.name.localeCompare(b.name)); renderClientes(); 
}

function renderClientes(){ 
    const container=document.getElementById('clientList'); container.innerHTML=""; 
    markers.forEach(m=> { if(m) map.removeLayer(m); }); markers=[]; 
    clients.forEach((c,i)=>{ 
        let div=document.createElement('div'); div.className='client'; 
        if(editingClientId === c.id) {
            div.classList.add('edit-mode');
            div.innerHTML = `<input id="edit_name" value="${c.name||''}" /><input id="edit_address" value="${c.address||''}" /><textarea id="edit_notes">${c.notes||''}</textarea><div style="display:flex; gap:8px"><button class="smallBtn saveBtn" onclick="saveEditClient('${c.id}')">💾</button><button class="smallBtn" onclick="cancelEdit()">❌</button></div>`;
        } else {
            div.innerHTML=`<div style="display:flex; align-items:center;"><input type="checkbox" id="c${i}" onchange="syncMarker(${i})"> <div style="flex:1"><b>${c.name}</b><br><small style="color: #64748b;">${c.address || 'GPS'}</small></div></div><div style="margin-top:8px"><button class="smallBtn" onclick='editClient("${c.id}")'>✏️ Editar</button><button class="smallBtn deleteBtn" onclick='deleteClient("${c.id}")'>🗑️ Borrar</button></div>`;
        }
        container.appendChild(div);
        if(c.lat && c.lng){ 
            const defaultIcon = getClientIcon(c);
            let m = L.marker([c.lat,c.lng], {icon: defaultIcon}).addTo(map).bindPopup(c.name);
            m.on('click', () => { 
                const cb = document.getElementById('c'+i); 
                if(cb){ cb.checked = !cb.checked; m.setIcon(cb.checked ? iconPin : defaultIcon); } 
            });
            markers[i] = m;
        }
    }); 
    document.getElementById('stats').innerHTML=clients.length; 
}

window.syncMarker = function(i) {
    if(markers[i]) {
        const cb = document.getElementById('c'+i);
        markers[i].setIcon(cb.checked ? iconPin : getClientIcon(clients[i]));
    }
}

window.addClient = async function() { 
    const inName=document.getElementById('name'), 
          inAddr=document.getElementById('address'), 
          inCoords=document.getElementById('manualCoords'), 
          inNotes=document.getElementById('notes');

    const name=inName.value.trim(), address=inAddr.value.trim(), coords=inCoords.value.trim();

    if(!name) return alert("El nombre es obligatorio");
    let finalLat, finalLng;

    if(coords){
        let parts = coords.replace(',', ' ').split(/\s+/);
        if(parts.length >= 2){
            finalLat = parseFloat(parts[0]);
            finalLng = parseFloat(parts[1]);
        }
    } else if(address) { 
        const co=await geocode(address); 
        if(!co) return alert("⚠️ Dirección no encontrada."); 
        finalLat=co.lat; finalLng=co.lng; 
    } else { 
        try { 
            const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej)); 
            finalLat = pos.coords.latitude; finalLng = pos.coords.longitude; 
        } catch(e) { return alert("GPS necesario"); } 
    }

    await addDoc(collection(db, "clientes"), { name, address, lat: finalLat, lng: finalLng, notes: inNotes.value, userId: auth.currentUser.uid }); 
    inName.value=""; inAddr.value=""; inCoords.value=""; inNotes.value=""; cargarClientes();
}

window.editClient = (id) => { editingClientId = id; renderClientes(); };
window.cancelEdit = () => { editingClientId = null; renderClientes(); };
window.saveEditClient = async (id) => {
    const n = document.getElementById('edit_name').value.trim(), a = document.getElementById('edit_address').value.trim(), nt = document.getElementById('edit_notes').value.trim();
    const data = { name: n, address: a, notes: nt };
    const co = await geocode(a); if(co) { data.lat = co.lat; data.lng = co.lng; }
    await updateDoc(doc(db, "clientes", id), data); editingClientId = null; cargarClientes();
};

window.deleteClient = async (id) => { if(confirm("¿Borrar?")) { await deleteDoc(doc(db,"clientes",id)); cargarClientes(); } };
window.deleteRoute = async (id) => { if(confirm("¿Borrar ruta?")) { await deleteDoc(doc(db,"rutas",id)); cargarRutas(); } };

window.createRoute = async function(isLoading = false){ 
    let sel=clients.filter((c,i)=>document.getElementById('c'+i)?.checked); if(sel.length<1) return alert("Selecciona clientes"); 
    currentStartOption = document.getElementById('startOption').value;
    let sLat, sLng;
    if(currentStartOption==="gps"){ try { const p=await new Promise((r,j)=>navigator.geolocation.getCurrentPosition(r,j)); sLat=p.coords.latitude; sLng=p.coords.longitude; } catch(e) { return alert("Error GPS"); } }
    else { let ad=document.getElementById('startAddress').value.trim(); const c=await geocode(ad); if(!c) return alert("Salida no encontrada"); sLat=c.lat; sLng=c.lng; }
    
    sel.sort((a, b) => {
        const distA = Math.sqrt(Math.pow(a.lat - sLat, 2) + Math.pow(a.lng - sLng, 2));
        const distB = Math.sqrt(Math.pow(b.lat - sLat, 2) + Math.pow(b.lng - sLng, 2));
        return distA - distB;
    });

    const inputCoords = [[sLat,sLng],...sel.map(c=>[c.lat,c.lng])];
    const strCoords = inputCoords.map(c => `${c[1]},${c[0]}`).join(';');
    try {
        const res = await fetch(`https://router.project-osrm.org/trip/v1/driving/${strCoords}?source=first&roundtrip=false&overview=full&geometries=geojson`);
        const data = await res.json();
        if(data.trips) {
            lastRouteCoords = data.waypoints.sort((a, b) => a.waypoint_index - b.waypoint_index).map(w => [w.location[1], w.location[0]]);
            lastRouteClients = lastRouteCoords.slice(1).map(coord => sel.find(c => Math.abs(c.lat - coord[0]) < 0.0008 && Math.abs(c.lng - coord[1]) < 0.0008)).filter(c => c);
            if(routeLine) map.removeLayer(routeLine); redMarkers.forEach(m=>map.removeLayer(m)); redMarkers=[];
            routeLine=L.geoJSON(data.trips[0].geometry,{style:{color:'#0ea5e9',weight:5}}).addTo(map); 
            map.fitBounds(routeLine.getBounds());
            lastRouteCoords.slice(1).forEach((c, idx) => {
                redMarkers.push(L.circleMarker(c,{radius:10,color:'red',fillColor:'white',fillOpacity:1}).addTo(map).bindTooltip(""+(idx+1), {permanent:true, direction:'center', className:'marker-label'}));
            });
            if(!isLoading) { await addDoc(collection(db, "rutas"),{date:document.getElementById('routeDate').value || "S/F", clients:sel.map(c=>c.id), userId: auth.currentUser.uid }); cargarRutas(); }
        }
    } catch(e) { console.error(e); }
}

window.loadRoute = async (id) => {
    const docRef = doc(db, "rutas", id);
    const docSnap = await getDoc(docRef);
    if (docSnap.exists()) {
        const rutaData = docSnap.data();
        clients.forEach((c, i) => {
            const cb = document.getElementById('c'+i);
            if(cb) cb.checked = rutaData.clients.includes(c.id);
            if(markers[i]) markers[i].setIcon(cb.checked ? iconPin : getClientIcon(c));
        });
        window.createRoute(true);
    }
};

window.enviarRutaGoogleMaps = function() {
    if (lastRouteCoords.length < 2) return alert("Crea una ruta primero");
    let origin = (currentStartOption === "gps") ? "My+Location" : encodeURIComponent(document.getElementById('startAddress').value);
    let lastClient = lastRouteClients[lastRouteClients.length - 1];
    let destination = (lastClient && lastClient.address) ? encodeURIComponent(lastClient.address) : `${lastRouteCoords[lastRouteCoords.length - 1][0]},${lastRouteCoords[lastRouteCoords.length - 1][1]}`;
    let waypoints = lastRouteClients.slice(0, -1).map(c => c.address ? encodeURIComponent(c.address) : `${c.lat},${c.lng}`).join('|');
    window.open(`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&waypoints=${waypoints}&travelmode=driving`, '_blank');
}

async function cargarRutas(){ 
    if(!auth.currentUser) return;
    const q = query(collection(db, "rutas"), where("userId", "==", auth.currentUser.uid));
    const snapshot = await getDocs(q); const container = document.getElementById('routeList'); container.innerHTML=""; 
    snapshot.docs.forEach(docSnap => {
        let div=document.createElement('div'); div.className="routeItem";
        div.innerHTML=`<span>📅 ${docSnap.data().date || 'S/F'}</span><div><button class="smallBtn" onclick="loadRoute('${docSnap.id}')">👁️</button><button class="smallBtn deleteBtn" onclick="deleteRoute('${docSnap.id}')">🗑️</button></div>`;
        container.appendChild(div);
    });
}

async function showUserPosition() {
    try {
        navigator.geolocation.getCurrentPosition(pos => {
            L.marker([pos.coords.latitude, pos.coords.longitude], {icon: iconUser}).addTo(map);
            map.setView([pos.coords.latitude, pos.coords.longitude], 13);
        });
    } catch(e) {}
}

document.addEventListener("DOMContentLoaded",()=>{
    document.getElementById('btnLogin').onclick = () => signInWithEmailAndPassword(auth, document.getElementById('email').value.trim(), document.getElementById('password').value).catch(e => alert(e.message));
    document.getElementById('btnRegister').onclick = () => createUserWithEmailAndPassword(auth, document.getElementById('email').value.trim(), document.getElementById('password').value).then(() => alert("✅ Cuenta creada")).catch(e => alert("Mínimo 6 caracteres"));
    document.getElementById('btnLogout').onclick = () => signOut(auth);
    document.getElementById('btnAddClient').onclick = window.addClient;
    document.getElementById('btnCreateRoute').onclick = () => window.createRoute(false);
    document.getElementById('btnRutaOrdenEstricto').onclick = () => window.enviarRutaGoogleMaps();
    document.getElementById('btnGoogleMaps').onclick = () => window.enviarRutaGoogleMaps();
    document.getElementById('btnWaze').onclick = () => {
        if(lastRouteCoords.length < 2) return alert("Crea ruta");
        const dest = lastRouteCoords[lastRouteCoords.length-1];
        window.open(`https://waze.com/ul?ll=${dest[0]},${dest[1]}&navigate=yes`, '_blank');
    };
    document.getElementById('btnClearRoute').onclick = () => { if(routeLine)map.removeLayer(routeLine); redMarkers.forEach(m=>map.removeLayer(m)); };
    document.getElementById('startOption').onchange = (e) => document.getElementById('startAddress').style.display = e.target.value === "manual" ? "block" : "none";
    document.getElementById('btnOpenGoogle').onclick = () => {
        const addr = document.getElementById('address').value;
        if(!addr) return alert("Escribe primero una dirección o nombre de negocio");
        window.open(`https://www.google.com/maps/search/${encodeURIComponent(addr)}`, '_blank');
    };
});

document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".accordion-header").forEach(function (header) {
        header.addEventListener("click", function () {
            var tab = header.parentElement;
            var open = tab.classList.contains("open");
            tab.classList.toggle("open", !open);
            header.setAttribute("aria-expanded", String(!open));
        });
    });
});
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, where, getDoc } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-auth.js";

const firebaseConfig = { apiKey: "AIzaSyByi9lTT4kN4YbD8cneKLmTm05RzCAgPhI", authDomain: "organizador-de-visitas-f10ad.firebaseapp.com", projectId: "organizador-de-visitas-f10ad", storageBucket: "organizador-de-visitas-f10ad.firebasestorage.app", messagingSenderId: "737024476908", appId: "1:737024476908:web:09cf2cc99ac0b7352f07c9" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let clients=[], markers=[], redMarkers=[], routeLine, lastRouteCoords=[], lastRouteClients=[], editingClientId = null, currentStartOption = "gps";

const iconNormal = new L.Icon({ iconUrl:"https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png", shadowUrl:"https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png", iconSize:[25,41], iconAnchor:[12,41] });
const iconFood = new L.Icon({ iconUrl:"https://cdn-icons-png.flaticon.com/512/3448/3448609.png", iconSize:[38,38], iconAnchor:[19,38] });
const iconHotel = new L.Icon({ iconUrl: "data:image/svg+xml;base64," + btoa(`<svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 38 38"><circle cx="19" cy="19" r="18" fill="#ff9900" stroke="white" stroke-width="2"/><text x="50%" y="55%" font-size="18" text-anchor="middle" fill="black" font-family="Arial" font-weight="bold" dominant-baseline="middle">H</text></svg>`), iconSize:[38,38], iconAnchor:[19,38] });
const iconPin = new L.Icon({ iconUrl:"https://cdn-icons-png.flaticon.com/512/684/684908.png", iconSize:[32,32], iconAnchor:[16,32] });
const iconUser = new L.Icon({ iconUrl:"https://cdn-icons-png.flaticon.com/512/684/684908.png", iconSize:[40,40], iconAnchor:[20,40] });

function getClientIcon(cliente){
  const text=(cliente.notes||"").toLowerCase();
  if(text.includes("comida")||text.includes("bar")||text.includes("restaurante")) return iconFood;
  if(text.includes("hotel")||text.includes("hostal")||text.includes("dormir")) return iconHotel;
  return iconNormal;
}

let map;
function initMap() {
    if (map) return;
    map = L.map('map').setView([40.4168,-3.7038],12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
}
initMap();

onAuthStateChanged(auth, (user) => {
    if (user) {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('mainSection').classList.remove('hidden');
        document.getElementById('userDisplay').innerText = user.email;
        cargarClientes(); cargarRutas(); showUserPosition();
    } else {
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('mainSection').classList.add('hidden');
    }
});

async function geocode(addr){ 
    try {
        let res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr)}`); 
        let data=await res.json(); return data.length>0 ? {lat:parseFloat(data[0].lat), lng:parseFloat(data[0].lon)} : null; 
    } catch(e) { return null; }
}

async function cargarClientes(){ 
    if(!auth.currentUser) return;
    const q = query(collection(db, "clientes"), where("userId", "==", auth.currentUser.uid));
    const snapshot = await getDocs(q); clients = snapshot.docs.map(d=>({...d.data(),id:d.id})).filter(c=>c.name); 
    clients.sort((a,b)=>a.name.localeCompare(b.name)); renderClientes(); 
}

function renderClientes(){ 
    const container=document.getElementById('clientList'); container.innerHTML=""; 
    markers.forEach(m=> { if(m) map.removeLayer(m); }); markers=[]; 
    clients.forEach((c,i)=>{ 
        let div=document.createElement('div'); div.className='client'; 
        if(editingClientId === c.id) {
            div.classList.add('edit-mode');
            div.innerHTML = `<input id="edit_name" value="${c.name||''}" /><input id="edit_address" value="${c.address||''}" /><textarea id="edit_notes">${c.notes||''}</textarea><div style="display:flex; gap:8px"><button class="smallBtn saveBtn" onclick="saveEditClient('${c.id}')">💾</button><button class="smallBtn" onclick="cancelEdit()">❌</button></div>`;
        } else {
            div.innerHTML=`<div style="display:flex; align-items:center;"><input type="checkbox" id="c${i}" onchange="syncMarker(${i})"> <div style="flex:1"><b>${c.name}</b><br><small style="color: #64748b;">${c.address || 'GPS'}</small></div></div><div style="margin-top:8px"><button class="smallBtn" onclick='editClient("${c.id}")'>✏️ Editar</button><button class="smallBtn deleteBtn" onclick='deleteClient("${c.id}")'>🗑️ Borrar</button></div>`;
        }
        container.appendChild(div);
        if(c.lat && c.lng){ 
            const defaultIcon = getClientIcon(c);
            let m = L.marker([c.lat,c.lng], {icon: defaultIcon}).addTo(map).bindPopup(c.name);
            m.on('click', () => { 
                const cb = document.getElementById('c'+i); 
                if(cb){ cb.checked = !cb.checked; m.setIcon(cb.checked ? iconPin : defaultIcon); } 
            });
            markers[i] = m;
        }
    }); 
    document.getElementById('stats').innerHTML=clients.length; 
}

window.syncMarker = function(i) {
    if(markers[i]) {
        const cb = document.getElementById('c'+i);
        markers[i].setIcon(cb.checked ? iconPin : getClientIcon(clients[i]));
    }
}

window.addClient = async function() { 
    const inName=document.getElementById('name'), 
          inAddr=document.getElementById('address'), 
          inCoords=document.getElementById('manualCoords'), 
          inNotes=document.getElementById('notes');

    const name=inName.value.trim(), address=inAddr.value.trim(), coords=inCoords.value.trim();

    if(!name) return alert("El nombre es obligatorio");
    let finalLat, finalLng;

    if(coords){
        let parts = coords.replace(',', ' ').split(/\s+/);
        if(parts.length >= 2){
            finalLat = parseFloat(parts[0]);
            finalLng = parseFloat(parts[1]);
        }
    } else if(address) { 
        const co=await geocode(address); 
        if(!co) return alert("⚠️ Dirección no encontrada."); 
        finalLat=co.lat; finalLng=co.lng; 
    } else { 
        try { 
            const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej)); 
            finalLat = pos.coords.latitude; finalLng = pos.coords.longitude; 
        } catch(e) { return alert("GPS necesario"); } 
    }

    await addDoc(collection(db, "clientes"), { name, address, lat: finalLat, lng: finalLng, notes: inNotes.value, userId: auth.currentUser.uid }); 
    inName.value=""; inAddr.value=""; inCoords.value=""; inNotes.value=""; cargarClientes();
}

window.editClient = (id) => { editingClientId = id; renderClientes(); };
window.cancelEdit = () => { editingClientId = null; renderClientes(); };
window.saveEditClient = async (id) => {
    const n = document.getElementById('edit_name').value.trim(), a = document.getElementById('edit_address').value.trim(), nt = document.getElementById('edit_notes').value.trim();
    const data = { name: n, address: a, notes: nt };
    const co = await geocode(a); if(co) { data.lat = co.lat; data.lng = co.lng; }
    await updateDoc(doc(db, "clientes", id), data); editingClientId = null; cargarClientes();
};

window.deleteClient = async (id) => { if(confirm("¿Borrar?")) { await deleteDoc(doc(db,"clientes",id)); cargarClientes(); } };
window.deleteRoute = async (id) => { if(confirm("¿Borrar ruta?")) { await deleteDoc(doc(db,"rutas",id)); cargarRutas(); } };

window.createRoute = async function(isLoading = false){ 
    let sel=clients.filter((c,i)=>document.getElementById('c'+i)?.checked); if(sel.length<1) return alert("Selecciona clientes"); 
    currentStartOption = document.getElementById('startOption').value;
    let sLat, sLng;
    if(currentStartOption==="gps"){ try { const p=await new Promise((r,j)=>navigator.geolocation.getCurrentPosition(r,j)); sLat=p.coords.latitude; sLng=p.coords.longitude; } catch(e) { return alert("Error GPS"); } }
    else { let ad=document.getElementById('startAddress').value.trim(); const c=await geocode(ad); if(!c) return alert("Salida no encontrada"); sLat=c.lat; sLng=c.lng; }
    
    sel.sort((a, b) => {
        const distA = Math.sqrt(Math.pow(a.lat - sLat, 2) + Math.pow(a.lng - sLng, 2));
        const distB = Math.sqrt(Math.pow(b.lat - sLat, 2) + Math.pow(b.lng - sLng, 2));
        return distA - distB;
    });

    const inputCoords = [[sLat,sLng],...sel.map(c=>[c.lat,c.lng])];
    const strCoords = inputCoords.map(c => `${c[1]},${c[0]}`).join(';');
    try {
        const res = await fetch(`https://router.project-osrm.org/trip/v1/driving/${strCoords}?source=first&roundtrip=false&overview=full&geometries=geojson`);
        const data = await res.json();
        if(data.trips) {
            lastRouteCoords = data.waypoints.sort((a, b) => a.waypoint_index - b.waypoint_index).map(w => [w.location[1], w.location[0]]);
            lastRouteClients = lastRouteCoords.slice(1).map(coord => sel.find(c => Math.abs(c.lat - coord[0]) < 0.0008 && Math.abs(c.lng - coord[1]) < 0.0008)).filter(c => c);
            if(routeLine) map.removeLayer(routeLine); redMarkers.forEach(m=>map.removeLayer(m)); redMarkers=[];
            routeLine=L.geoJSON(data.trips[0].geometry,{style:{color:'#0ea5e9',weight:5}}).addTo(map); 
            map.fitBounds(routeLine.getBounds());
            lastRouteCoords.slice(1).forEach((c, idx) => {
                redMarkers.push(L.circleMarker(c,{radius:10,color:'red',fillColor:'white',fillOpacity:1}).addTo(map).bindTooltip(""+(idx+1), {permanent:true, direction:'center', className:'marker-label'}));
            });
            if(!isLoading) { await addDoc(collection(db, "rutas"),{date:document.getElementById('routeDate').value || "S/F", clients:sel.map(c=>c.id), userId: auth.currentUser.uid }); cargarRutas(); }
        }
    } catch(e) { console.error(e); }
}

window.loadRoute = async (id) => {
    const docRef = doc(db, "rutas", id);
    const docSnap = await getDoc(docRef);
    if (docSnap.exists()) {
        const rutaData = docSnap.data();
        clients.forEach((c, i) => {
            const cb = document.getElementById('c'+i);
            if(cb) cb.checked = rutaData.clients.includes(c.id);
            if(markers[i]) markers[i].setIcon(cb.checked ? iconPin : getClientIcon(c));
        });
        window.createRoute(true);
    }
};

window.enviarRutaGoogleMaps = function() {
    if (lastRouteCoords.length < 2) return alert("Crea una ruta primero");
    let origin = (currentStartOption === "gps") ? "My+Location" : encodeURIComponent(document.getElementById('startAddress').value);
    let lastClient = lastRouteClients[lastRouteClients.length - 1];
    let destination = (lastClient && lastClient.address) ? encodeURIComponent(lastClient.address) : `${lastRouteCoords[lastRouteCoords.length - 1][0]},${lastRouteCoords[lastRouteCoords.length - 1][1]}`;
    let waypoints = lastRouteClients.slice(0, -1).map(c => c.address ? encodeURIComponent(c.address) : `${c.lat},${c.lng}`).join('|');
    window.open(`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&waypoints=${waypoints}&travelmode=driving`, '_blank');
}

async function cargarRutas(){ 
    if(!auth.currentUser) return;
    const q = query(collection(db, "rutas"), where("userId", "==", auth.currentUser.uid));
    const snapshot = await getDocs(q); const container = document.getElementById('routeList'); container.innerHTML=""; 
    snapshot.docs.forEach(docSnap => {
        let div=document.createElement('div'); div.className="routeItem";
        div.innerHTML=`<span>📅 ${docSnap.data().date || 'S/F'}</span><div><button class="smallBtn" onclick="loadRoute('${docSnap.id}')">👁️</button><button class="smallBtn deleteBtn" onclick="deleteRoute('${docSnap.id}')">🗑️</button></div>`;
        container.appendChild(div);
    });
}

async function showUserPosition() {
    try {
        navigator.geolocation.getCurrentPosition(pos => {
            L.marker([pos.coords.latitude, pos.coords.longitude], {icon: iconUser}).addTo(map);
            map.setView([pos.coords.latitude, pos.coords.longitude], 13);
        });
    } catch(e) {}
}

document.addEventListener("DOMContentLoaded",()=>{
    document.getElementById('btnLogin').onclick = () => signInWithEmailAndPassword(auth, document.getElementById('email').value.trim(), document.getElementById('password').value).catch(e => alert(e.message));
    document.getElementById('btnRegister').onclick = () => createUserWithEmailAndPassword(auth, document.getElementById('email').value.trim(), document.getElementById('password').value).then(() => alert("✅ Cuenta creada")).catch(e => alert("Mínimo 6 caracteres"));
    document.getElementById('btnLogout').onclick = () => signOut(auth);
    document.getElementById('btnAddClient').onclick = window.addClient;
    document.getElementById('btnCreateRoute').onclick = () => window.createRoute(false);
    document.getElementById('btnRutaOrdenEstricto').onclick = () => window.enviarRutaGoogleMaps();
    document.getElementById('btnGoogleMaps').onclick = () => window.enviarRutaGoogleMaps();
    document.getElementById('btnWaze').onclick = () => {
        if(lastRouteCoords.length < 2) return alert("Crea ruta");
        const dest = lastRouteCoords[lastRouteCoords.length-1];
        window.open(`https://waze.com/ul?ll=${dest[0]},${dest[1]}&navigate=yes`, '_blank');
    };
    document.getElementById('btnClearRoute').onclick = () => { if(routeLine)map.removeLayer(routeLine); redMarkers.forEach(m=>map.removeLayer(m)); };
    document.getElementById('startOption').onchange = (e) => document.getElementById('startAddress').style.display = e.target.value === "manual" ? "block" : "none";
    document.getElementById('btnOpenGoogle').onclick = () => {
        const addr = document.getElementById('address').value;
        if(!addr) return alert("Escribe primero una dirección o nombre de negocio");
        window.open(`https://www.google.com/maps/search/${encodeURIComponent(addr)}`, '_blank');
    };
});
</script>
</body>
</html>
