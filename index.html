<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Organizador de Rutas Ana</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f766e" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
<style>
:root{--ink:#10282c;--teal:#0f766e;--teal2:#0d9488;--amber:#f59e0b;--bg:#f4f6f5;--line:#dfe6e4;--mute:#5d706e;--danger:#dc2626;--tab:62px;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;font-size:15px}
.hidden{display:none!important}
#map{position:fixed;inset:0}

/* Panel inferior */
#sheet{position:fixed;left:0;right:0;bottom:calc(var(--tab) + var(--safe));height:50dvh;max-height:calc(100dvh - var(--tab) - var(--safe) - 56px);background:rgba(255,255,255,.88);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-radius:22px 22px 0 0;box-shadow:0 -8px 28px rgba(16,40,44,.18);z-index:500;display:flex;flex-direction:column;transition:height .25s ease}
#sheet.drag{transition:none}
#sheetTop{display:flex;align-items:center;gap:10px;padding:0 14px 8px 0;flex:none}
#dragZone{flex:1;padding:10px 0 0 16px;touch-action:none;cursor:grab;user-select:none}
#dragZone .bar{width:42px;height:5px;border-radius:3px;background:#b7c4c2;margin:0 auto 10px}
.title{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700}
.badge{background:var(--teal);color:#fff;border-radius:20px;padding:1px 10px;font-size:13px;font-weight:600}
#btnQuick{width:auto;min-height:44px;padding:0 16px;margin-top:8px;border-radius:22px;background:var(--amber);color:#1f1300}
#body{flex:1;overflow-y:auto;padding:4px 14px 24px;overscroll-behavior:contain}
.pane{display:none}.pane.on{display:block}

/* Barra de pestañas */
#tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab) + var(--safe));padding-bottom:var(--safe);background:#fff;border-top:1px solid var(--line);display:flex;z-index:600}
.tab{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 11px system-ui,sans-serif;color:var(--mute);cursor:pointer}
.tab i{font-size:20px}
.tab.on{color:var(--teal)}

/* Controles */
.btn{width:100%;min-height:48px;padding:0 16px;border:0;border-radius:12px;font:600 15px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:#fff;background:var(--teal)}
.btn:active{transform:scale(.98)}
.btn.sm{min-height:44px;font-size:14px}
.btn.danger{background:var(--danger)}
.btn.ghost{background:#e6eceb;color:var(--ink)}
.btn.amber{background:var(--amber);color:#1f1300}
input,select,textarea{width:100%;margin:6px 0;padding:12px;min-height:48px;border:1px solid var(--line);border-radius:12px;background:#fff;font:16px system-ui,sans-serif;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
label{display:block;font-weight:600;font-size:13px;color:var(--mute);margin-top:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
h4{margin:16px 0 8px;font-size:14px;color:var(--mute)}
.step{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.step b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px}
.step div{flex:1}
.row{display:flex;gap:8px;align-items:center}
.row .btn{width:auto;flex:none;padding:0 14px}

/* Clientes */
#searchBox{position:sticky;top:0;z-index:2;background:rgba(244,246,245,.95);padding:4px 0 6px}
.cl{display:flex;gap:12px;align-items:center;padding:10px 6px 10px 12px;min-height:60px;background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer}
.cl.sel{border-color:var(--teal);background:#e8f7f3}
.dot{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid #b7c4c2;display:grid;place-items:center;font-weight:700;color:#fff}
.sel .dot{background:var(--teal);border-color:var(--teal)}
.info{flex:1;min-width:0}
.info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info small{display:block;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info .note{color:#9a6a00}
.more{flex:none;width:44px;height:44px;border:0;background:none;font-size:20px;color:var(--mute);cursor:pointer}
.acts{display:flex;gap:8px;margin:-2px 0 10px}
.edit{background:#eef7f6;border:2px solid var(--teal);border-radius:14px;padding:10px;margin-bottom:10px}
.types{display:flex;gap:8px;margin:6px 0}
.types button{flex:1;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2px solid var(--line);background:#fff;border-radius:12px;font:600 13px system-ui,sans-serif;color:var(--ink);cursor:pointer}
.types button span{font-size:26px;line-height:1}
.types button.on{border-color:var(--teal);background:#e8f7f3}
.empty{text-align:center;color:var(--mute);padding:28px 10px}

/* Rutas guardadas */
.routeItem{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px;margin-bottom:8px}
.routeItem span{flex:1}
.ib{width:44px;height:44px;border:0;border-radius:12px;background:#e6eceb;font-size:17px;cursor:pointer}
.ib.del{background:#fee2e2}

/* Navegar */
.navgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.navgrid .btn{flex-direction:column;min-height:96px;font-size:14px;gap:6px}
.navgrid .btn i{font-size:24px}

.marker-label{background:#fff;border:2px solid red;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;color:red}

/* Acceso */
#auth{position:fixed;inset:0;z-index:2000;background:linear-gradient(160deg,#10282c,#0f766e);display:flex;align-items:center;justify-content:center;padding:20px}
#auth .card{width:100%;max-width:380px;padding:22px}
#auth h2{margin:0 0 6px;font-size:22px}
#auth p{margin:0 0 10px;color:var(--mute)}

/* Escritorio: panel lateral */
@media (min-width:769px){
  #map{right:400px}
  #sheet{left:auto;right:0;width:400px;top:0;height:auto!important;max-height:none;border-radius:0;transition:none}
  #tabbar{left:auto;width:400px}
  #dragZone{cursor:default}#dragZone .bar{display:none}
  #dragZone{padding-top:16px}
}
</style>
</head>
<body>
<div id="map"></div>

<div id="auth">
  <div class="card">
    <h2>Rutas de Ana</h2>
    <p>Inicia sesión para ver tus clientes.</p>
    <input id="email" type="email" autocomplete="email" placeholder="Correo electrónico" />
    <input id="password" type="password" autocomplete="current-password" placeholder="Contraseña (mín. 6)" />
    <button id="btnLogin" type="button" class="btn" style="margin-top:8px">Iniciar sesión</button>
    <button id="btnRegister" type="button" class="btn ghost" style="margin-top:8px">Crear cuenta nueva</button>
    <p id="authMsg" role="status" style="margin:12px 0 0;min-height:20px;font-size:14px;color:#b45309;font-weight:600"></p>
  </div>
</div>

<div id="sheet" class="hidden">
  <div id="sheetTop">
    <div id="dragZone"><div class="bar"></div><div class="title"><span id="sheetTitle">Clientes</span><span id="stats" class="badge">0</span></div></div>
    <button id="btnQuick" class="btn hidden">🧭 Crear ruta</button>
  </div>
  <div id="body">
    <!-- CLIENTES -->
    <div id="pane-clients" class="pane on">
      <div id="searchBox">
        <input id="search" type="search" placeholder="🔍 Buscar cliente" />
        <button id="btnDeselect" class="btn ghost sm hidden">Quitar selección</button>
      </div>
      <div id="clientList"></div>
    </div>
    <!-- RUTA -->
    <div id="pane-route" class="pane">
      <div class="card">
        <p id="selHint" style="margin:0 0 4px;font-weight:600">0 clientes seleccionados</p>
        <label for="routeDate">Fecha</label>
        <input type="date" id="routeDate" />
        <label for="startOption">Salida</label>
        <select id="startOption"><option value="gps">📍 Mi ubicación actual</option><option value="manual">✏️ Dirección manual</option></select>
        <input id="startAddress" class="hidden" placeholder="Dirección de salida" />
        <button id="btnCreateRoute" class="btn" style="margin-top:8px">🧭 Crear ruta</button>
      </div>
      <h4>Rutas guardadas</h4>
      <div id="routeList"></div>
      <p style="text-align:center;margin-top:18px"><span id="userDisplay" style="color:var(--mute);font-size:13px"></span><br><button id="btnLogout" class="btn ghost sm" style="margin-top:8px">Cerrar sesión</button></p>
    </div>
    <!-- NAVEGAR -->
    <div id="pane-nav" class="pane">
      <div class="navgrid">
        <button id="btnRutaOrdenEstricto" class="btn amber"><i class="fas fa-route"></i>Google<br>(mi orden)</button>
        <button id="btnGoogleMaps" class="btn"><i class="fas fa-globe"></i>Google<br>(optimizada)</button>
        <button id="btnWaze" class="btn" style="background:#2563eb"><i class="fas fa-location-arrow"></i>Waze</button>
        <button id="btnConsultarPrevision" class="btn" style="background:#7c3aed"><i class="fas fa-cloud-sun-rain"></i>Tiempo y<br>tráfico</button>
      </div>
      <button id="btnClearRoute" class="btn ghost" style="margin-top:12px">🧹 Limpiar ruta del mapa</button>
    </div>
    <!-- AÑADIR -->
    <div id="pane-add" class="pane">
      <div class="card">
        <input id="name" placeholder="Nombre" autocomplete="off" />
        <label style="margin-top:4px">¿Qué es?</label>
        <div id="typePicker" class="types"></div>
        <div class="step"><b>1</b><div>
          <input id="address" placeholder="Dirección o negocio" autocomplete="off" style="margin-top:0" />
          <button id="btnOpenGoogle" class="btn sm" style="background:#4285F4"><i class="fab fa-google"></i> Buscar en Google Maps</button>
        </div></div>
        <div class="step"><b>2</b><div>
          <div class="row"><input id="manualCoords" placeholder="40.416775, -3.703790" inputmode="decimal" style="margin:0" /><button id="btnPaste" class="btn sm ghost" type="button">📋 Pegar</button></div>
          <small style="color:var(--mute)">Copia las coordenadas de Google y pégalas aquí. Si lo dejas vacío, se buscarán por la dirección.</small>
        </div></div>
        <textarea id="notes" placeholder="Notas (Hotel, Restaurante...)" style="margin-top:12px"></textarea>
        <button id="btnAddClient" class="btn">➕ Guardar cliente</button>
      </div>
    </div>
  </div>
</div>

<nav id="tabbar" class="hidden">
  <button class="tab on" data-tab="clients"><i class="fas fa-users"></i>Clientes</button>
  <button class="tab" data-tab="route"><i class="fas fa-route"></i>Ruta</button>
  <button class="tab" data-tab="nav"><i class="fas fa-location-arrow"></i>Navegar</button>
  <button class="tab" data-tab="add"><i class="fas fa-plus"></i>Añadir</button>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, where, getDoc } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-auth.js";

const firebaseConfig = { apiKey: "AIzaSyByi9lTT4kN4YbD8cneKLmTm05RzCAgPhI", authDomain: "organizador-de-visitas-f10ad.firebaseapp.com", projectId: "organizador-de-visitas-f10ad", storageBucket: "organizador-de-visitas-f10ad.firebasestorage.app", messagingSenderId: "737024476908", appId: "1:737024476908:web:09cf2cc99ac0b7352f07c9" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const isDesktop = () => matchMedia('(min-width:769px)').matches;

/* ---------- Acceso (va primero: funciona aunque el mapa falle) ---------- */
const authMsg = t => { $('authMsg').textContent = t || ''; };
const authErr = e => ({
  'auth/invalid-email':'El correo no es válido.',
  'auth/missing-password':'Escribe la contraseña.',
  'auth/weak-password':'La contraseña debe tener al menos 6 caracteres.',
  'auth/email-already-in-use':'Ese correo ya tiene cuenta. Pulsa Iniciar sesión.',
  'auth/invalid-credential':'Correo o contraseña incorrectos.',
  'auth/wrong-password':'Correo o contraseña incorrectos.',
  'auth/user-not-found':'Correo o contraseña incorrectos.',
  'auth/too-many-requests':'Demasiados intentos. Espera un momento.',
  'auth/network-request-failed':'Sin conexión. Revisa tu internet.',
  'auth/unauthorized-domain':'Este dominio no está autorizado en Firebase.'
}[e.code] || ('Error: ' + (e.code || e.message)));
$('btnLogin').onclick = async () => {
  authMsg('Entrando…');
  try { await signInWithEmailAndPassword(auth, $('email').value.trim(), $('password').value); authMsg(''); }
  catch(e){ authMsg(authErr(e)); }
};
$('btnRegister').onclick = async () => {
  authMsg('Creando cuenta…');
  try { await createUserWithEmailAndPassword(auth, $('email').value.trim(), $('password').value); authMsg(''); }
  catch(e){ authMsg(authErr(e)); }
};
$('btnLogout').onclick = () => signOut(auth);
onAuthStateChanged(auth, (user) => {
  const on = !!user;
  $('auth').classList.toggle('hidden', on);
  $('sheet').classList.toggle('hidden', !on);
  $('tabbar').classList.toggle('hidden', !on);
  if(on){
    $('userDisplay').innerText = user.email;
    Promise.resolve().then(() => { cargarClientes(); cargarRutas(); showUserPosition(); }).catch(console.error);
  }
});
if (typeof L === 'undefined') authMsg('No se ha podido cargar el mapa. Revisa la conexión y recarga la página.');

let clients=[], markers={}, redMarkers=[], routeLine, lastRouteCoords=[], lastRouteClients=[], lastListOrderClients=[], selectionOrder=[], editingClientId=null, openMenuId=null, currentStartOption="gps", lastRouteOrigin=null, filterText="", sheetState="half", newType="cliente", editType="cliente";

const iconNormal = new L.Icon({ iconUrl:"https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png", shadowUrl:"https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png", iconSize:[25,41], iconAnchor:[12,41] });
const iconFood = new L.Icon({ iconUrl:"https://cdn-icons-png.flaticon.com/512/3448/3448609.png", iconSize:[38,38], iconAnchor:[19,38] });
const iconHotel = new L.Icon({ iconUrl: "data:image/svg+xml;base64," + btoa(`<svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 38 38"><circle cx="19" cy="19" r="18" fill="#ff9900" stroke="white" stroke-width="2"/><text x="50%" y="55%" font-size="18" text-anchor="middle" fill="black" font-family="Arial" font-weight="bold" dominant-baseline="middle">H</text></svg>`), iconSize:[38,38], iconAnchor:[19,38] });
const iconPin = new L.Icon({ iconUrl:"https://cdn-icons-png.flaticon.com/512/684/684908.png", iconSize:[32,32], iconAnchor:[16,32] });
const iconUser = new L.Icon({ iconUrl:"https://cdn-icons-png.flaticon.com/512/684/684908.png", iconSize:[40,40], iconAnchor:[20,40] });

const TYPES = {
  cliente:     { emoji:"📍", label:"Cliente" },
  restaurante: { emoji:"🍽️", label:"Restaurante" },
  hotel:       { emoji:"🏨", label:"Hotel" }
};
// Usa el tipo guardado; los clientes antiguos sin tipo se deducen de sus notas
function clientType(c){
  if(c.type && TYPES[c.type]) return c.type;
  const t=(c.notes||"").toLowerCase();
  if(t.includes("comida")||t.includes("bar")||t.includes("restaurante")) return "restaurante";
  if(t.includes("hotel")||t.includes("hostal")||t.includes("dormir")) return "hotel";
  return "cliente";
}
function typePickerHTML(attr, current){
  return Object.entries(TYPES).map(([k,v]) => `<button type="button" ${attr}="${k}" class="${k===current?'on':''}"><span>${v.emoji}</span>${v.label}</button>`).join("");
}
function getClientIcon(cliente){
  const t = clientType(cliente);
  if(t==="restaurante") return iconFood;
  if(t==="hotel") return iconHotel;
  return iconNormal;
}

const map = L.map('map').setView([40.4168,-3.7038],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

/* ---------- Panel inferior y pestañas ---------- */
const sheet = $('sheet'), dragZone = $('dragZone');
const TITLES = { clients:"Clientes", route:"Planificador", nav:"Navegación", add:"Nuevo cliente" };

function setSheet(s){
  sheetState = s;
  sheet.style.height = s==='peek' ? '84px' : s==='half' ? '50dvh' : '100dvh';
}
function setTab(t){
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id==='pane-'+t));
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab===t));
  $('sheetTitle').textContent = TITLES[t];
  $('stats').classList.toggle('hidden', t!=='clients');
  $('body').scrollTop = 0;
  if(t==='add') setSheet('full'); else if(sheetState==='peek') setSheet('half');
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));
setSheet('half');

let dragY=null, dragH=0;
dragZone.addEventListener('pointerdown', e => { if(isDesktop()) return; dragY=e.clientY; dragH=sheet.offsetHeight; sheet.classList.add('drag'); dragZone.setPointerCapture(e.pointerId); });
dragZone.addEventListener('pointermove', e => { if(dragY===null) return; sheet.style.height = Math.max(84, dragH + (dragY - e.clientY)) + 'px'; });
const endDrag = e => {
  if(dragY===null) return;
  const moved = Math.abs(dragY - e.clientY);
  sheet.classList.remove('drag');
  const h = sheet.offsetHeight; dragY = null;
  if(moved < 6){ setSheet(sheetState==='peek' ? 'half' : sheetState==='half' ? 'full' : 'peek'); return; }
  setSheet(h < innerHeight*0.3 ? 'peek' : h < innerHeight*0.65 ? 'half' : 'full');
};
dragZone.addEventListener('pointerup', endDrag);
dragZone.addEventListener('pointercancel', endDrag);

/* ---------- Datos ---------- */
async function geocode(addr){
  try {
    let res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr)}`);
    let data=await res.json(); return data.length>0 ? {lat:parseFloat(data[0].lat), lng:parseFloat(data[0].lon)} : null;
  } catch(e) { return null; }
}

async function cargarClientes(){
  if(!auth.currentUser) return;
  const q = query(collection(db, "clientes"), where("userId", "==", auth.currentUser.uid));
  const snapshot = await getDocs(q); clients = snapshot.docs.map(d=>({...d.data(),id:d.id})).filter(c=>c.name);
  clients.sort((a,b)=>a.name.localeCompare(b.name)); renderClientes();
}

const isSel = c => selectionOrder.includes(c.id);
function updateMarker(c){ if(markers[c.id]) markers[c.id].setIcon(isSel(c) ? iconPin : getClientIcon(c)); }

function toggleClient(id){
  selectionOrder = isSel({id}) ? selectionOrder.filter(x=>x!==id) : [...selectionOrder, id];
  const c = clients.find(x=>x.id===id); if(c) updateMarker(c);
  renderList();
}

function updateQuick(){
  const n = selectionOrder.length;
  $('btnQuick').classList.toggle('hidden', n===0);
  $('btnQuick').textContent = `🧭 Crear ruta · ${n}`;
  $('btnDeselect').classList.toggle('hidden', n===0);
  $('selHint').textContent = n===1 ? "1 cliente seleccionado" : `${n} clientes seleccionados`;
}

function renderMarkers(){
  Object.values(markers).forEach(m => map.removeLayer(m)); markers={};
  clients.forEach(c => {
    if(!(c.lat && c.lng)) return;
    const m = L.marker([c.lat,c.lng], {icon: isSel(c) ? iconPin : getClientIcon(c)}).addTo(map).bindPopup(c.name);
    m.on('click', () => toggleClient(c.id));
    markers[c.id] = m;
  });
}

function renderList(){
  const body = $('body'), top = body.scrollTop;
  const box = $('clientList'); box.innerHTML = "";
  const ft = filterText.toLowerCase();
  let shown = 0;
  clients.forEach(c => {
    if(ft && !`${c.name} ${c.address||''} ${c.notes||''}`.toLowerCase().includes(ft)) return;
    shown++;
    const wrap = document.createElement('div'); wrap.dataset.id = c.id;
    if(editingClientId === c.id){
      wrap.innerHTML = `<div class="edit"><input id="edit_name" value="${esc(c.name)}" placeholder="Nombre" /><input id="edit_address" value="${esc(c.address)}" placeholder="Dirección" /><textarea id="edit_notes" placeholder="Notas">${esc(c.notes)}</textarea><div class="types">${typePickerHTML('data-etype', editType)}</div><div class="acts" style="margin:6px 0 0"><button class="btn sm" data-save>💾 Guardar</button><button class="btn sm ghost" data-cancel>Cancelar</button></div></div>`;
    } else {
      const n = selectionOrder.indexOf(c.id) + 1;
      wrap.innerHTML = `<div class="cl ${n?'sel':''}"><div class="dot">${n||''}</div><div class="info"><b>${TYPES[clientType(c)].emoji} ${esc(c.name)}</b><small>${esc(c.address||'Ubicación GPS')}</small>${c.notes?`<small class="note">${esc(c.notes)}</small>`:''}</div><button class="more" data-more aria-label="Más opciones">⋯</button></div>` +
        (openMenuId===c.id ? `<div class="acts"><button class="btn sm ghost" data-edit>✏️ Editar</button><button class="btn sm danger" data-del>🗑️ Borrar</button></div>` : '');
    }
    box.appendChild(wrap);
  });
  if(!shown) box.innerHTML = `<div class="empty">${clients.length ? 'Ningún cliente coincide con la búsqueda.' : 'Aún no hay clientes. Toca Añadir para crear el primero.'}</div>`;
  $('stats').textContent = clients.length;
  updateQuick();
  body.scrollTop = top;
}

function renderClientes(){
  selectionOrder = selectionOrder.filter(id => clients.some(c=>c.id===id));
  renderMarkers(); renderList();
}

$('clientList').addEventListener('click', e => {
  const w = e.target.closest('[data-id]'); if(!w) return; const id = w.dataset.id;
  if(e.target.closest('[data-more]')){ openMenuId = openMenuId===id ? null : id; return renderList(); }
  if(e.target.closest('[data-edit]')){ editingClientId = id; openMenuId = null; const c0 = clients.find(x=>x.id===id); editType = c0 ? clientType(c0) : "cliente"; return renderList(); }
  const et = e.target.closest('[data-etype]');
  if(et){ editType = et.dataset.etype; w.querySelectorAll('[data-etype]').forEach(b => b.classList.toggle('on', b === et)); return; }
  if(e.target.closest('[data-del]')) return window.deleteClient(id);
  if(e.target.closest('[data-save]')) return window.saveEditClient(id);
  if(e.target.closest('[data-cancel]')){ editingClientId = null; return renderList(); }
  if(e.target.closest('input,textarea,.acts,.edit')) return;
  if(e.target.closest('.cl')) toggleClient(id);
});
$('search').oninput = e => { filterText = e.target.value.trim(); renderList(); };
$('btnDeselect').onclick = () => { const ids = selectionOrder; selectionOrder = []; ids.forEach(id => { const c = clients.find(x=>x.id===id); if(c) updateMarker(c); }); renderList(); };

window.addClient = async function() {
  const inName=$('name'), inAddr=$('address'), inCoords=$('manualCoords'), inNotes=$('notes');
  const name=inName.value.trim(), address=inAddr.value.trim(), coords=inCoords.value.trim();

  if(!name) return alert("El nombre es obligatorio");
  let finalLat, finalLng;

  if(coords){
    let parts = coords.replace(',', ' ').split(/\s+/);
    if(parts.length >= 2){ finalLat = parseFloat(parts[0]); finalLng = parseFloat(parts[1]); }
    if(!Number.isFinite(finalLat) || !Number.isFinite(finalLng)) return alert("Las coordenadas no son válidas. Ejemplo: 40.416775, -3.703790");
  } else if(address) {
    const co=await geocode(address);
    if(!co) return alert("⚠️ Dirección no encontrada.");
    finalLat=co.lat; finalLng=co.lng;
  } else {
    try {
      const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej));
      finalLat = pos.coords.latitude; finalLng = pos.coords.longitude;
    } catch(e) { return alert("GPS necesario"); }
  }

  await addDoc(collection(db, "clientes"), { name, address, lat: finalLat, lng: finalLng, notes: inNotes.value, type: newType, userId: auth.currentUser.uid });
  inName.value=""; inAddr.value=""; inCoords.value=""; inNotes.value=""; newType="cliente"; renderTypePicker();
  await cargarClientes(); setTab('clients'); setSheet('half');
}

window.saveEditClient = async (id) => {
  const n = $('edit_name').value.trim(), a = $('edit_address').value.trim(), nt = $('edit_notes').value.trim();
  if(!n) return alert("El nombre es obligatorio");
  const old = clients.find(c=>c.id===id) || {};
  const data = { name: n, address: a, notes: nt, type: editType };
  if(a && a !== (old.address||"")){ const co = await geocode(a); if(co) { data.lat = co.lat; data.lng = co.lng; } }
  await updateDoc(doc(db, "clientes", id), data); editingClientId = null; await cargarClientes();
};

window.deleteClient = async (id) => { if(confirm("¿Borrar cliente?")) { await deleteDoc(doc(db,"clientes",id)); openMenuId=null; cargarClientes(); } };
window.deleteRoute = async (id) => { if(confirm("¿Borrar ruta?")) { await deleteDoc(doc(db,"rutas",id)); cargarRutas(); } };

/* ---------- Rutas ---------- */
window.createRoute = async function(isLoading = false){
  let selListOrder = selectionOrder.map(id => clients.find(c=>c.id===id)).filter(Boolean);
  let sel = selListOrder.slice();
  if(sel.length<1) return alert("Selecciona clientes");
  currentStartOption = $('startOption').value;
  let sLat, sLng;
  if(currentStartOption==="gps"){ try { const p=await new Promise((r,j)=>navigator.geolocation.getCurrentPosition(r,j)); sLat=p.coords.latitude; sLng=p.coords.longitude; } catch(e) { return alert("Error GPS"); } }
  else { let ad=$('startAddress').value.trim(); const c=await geocode(ad); if(!c) return alert("Salida no encontrada"); sLat=c.lat; sLng=c.lng; }
  lastRouteOrigin = { lat: sLat, lng: sLng, name: currentStartOption === "manual" ? ($('startAddress').value.trim() || `${sLat}, ${sLng}`) : "Mi ubicación actual" };

  sel.sort((a, b) => {
    const distA = Math.sqrt(Math.pow(a.lat - sLat, 2) + Math.pow(a.lng - sLng, 2));
    const distB = Math.sqrt(Math.pow(b.lat - sLat, 2) + Math.pow(b.lng - sLng, 2));
    return distA - distB;
  });

  const inputCoords = [[sLat,sLng],...sel.map(c=>[c.lat,c.lng])];
  const strCoords = inputCoords.map(c => `${c[1]},${c[0]}`).join(';');
  try {
    const res = await fetch(`https://router.project-osrm.org/trip/v1/driving/${strCoords}?source=first&roundtrip=false&overview=full&geometries=geojson`);
    const data = await res.json();
    if(data.trips) {
      lastRouteCoords = data.waypoints.sort((a, b) => a.waypoint_index - b.waypoint_index).map(w => [w.location[1], w.location[0]]);
      lastRouteClients = lastRouteCoords.slice(1).map(coord => sel.find(c => Math.abs(c.lat - coord[0]) < 0.0008 && Math.abs(c.lng - coord[1]) < 0.0008)).filter(c => c);
      lastListOrderClients = selListOrder; if(routeLine) map.removeLayer(routeLine); redMarkers.forEach(m=>map.removeLayer(m)); redMarkers=[];
      routeLine=L.geoJSON(data.trips[0].geometry,{style:{color:'#0d9488',weight:5}}).addTo(map);
      setTab('nav'); setSheet('half');
      map.fitBounds(routeLine.getBounds(), { paddingTopLeft:[20,20], paddingBottomRight:[20, isDesktop() ? 20 : Math.round(innerHeight*0.5)+20] });
      lastRouteCoords.slice(1).forEach((c, idx) => {
        redMarkers.push(L.circleMarker(c,{radius:10,color:'red',fillColor:'white',fillOpacity:1}).addTo(map).bindTooltip(""+(idx+1), {permanent:true, direction:'center', className:'marker-label'}));
      });
      if(!isLoading) { await addDoc(collection(db, "rutas"),{date:$('routeDate').value || "S/F", clients:selListOrder.map(c=>c.id), userId: auth.currentUser.uid }); cargarRutas(); }
    } else { alert("No se pudo calcular la ruta."); }
  } catch(e) { console.error(e); alert("Error al calcular la ruta. Revisa la conexión."); }
}

window.loadRoute = async (id) => {
  const docSnap = await getDoc(doc(db, "rutas", id));
  if (docSnap.exists()) {
    const old = selectionOrder;
    selectionOrder = (docSnap.data().clients || []).filter(cid => clients.some(c=>c.id===cid));
    clients.forEach(updateMarker);
    renderList();
    window.createRoute(true);
  }
};

window.enviarRutaGoogleMaps = function() {
  if (lastRouteCoords.length < 2) return alert("Crea una ruta primero");
  let origin = (currentStartOption === "gps") ? "My+Location" : encodeURIComponent($('startAddress').value);
  let lastClient = lastRouteClients[lastRouteClients.length - 1];
  let destination = (lastClient && lastClient.address) ? encodeURIComponent(lastClient.address) : `${lastRouteCoords[lastRouteCoords.length - 1][0]},${lastRouteCoords[lastRouteCoords.length - 1][1]}`;
  let waypoints = lastRouteClients.slice(0, -1).map(c => c.address ? encodeURIComponent(c.address) : `${c.lat},${c.lng}`).join('|');
  window.open(`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&waypoints=${waypoints}&travelmode=driving`, '_blank');
}

window.enviarRutaGoogleMapsOrden = function() {
  if (lastRouteCoords.length < 2 || lastListOrderClients.length < 1) return alert("Crea una ruta primero");
  let origin = (currentStartOption === "gps") ? "My+Location" : encodeURIComponent($('startAddress').value);
  const stopText = c => (c.address ? encodeURIComponent(c.address) : `${c.lat},${c.lng}`);
  const ordered = lastListOrderClients;
  let destination = stopText(ordered[ordered.length - 1]);
  let waypoints = ordered.slice(0, -1).map(stopText).join('|');
  window.open(`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&waypoints=${waypoints}&travelmode=driving`, '_blank');
}

/* ---------- Previsión de viaje ---------- */
function mostrarSelectorFechaHora(onConfirm, fechaInicial) {
  const existente = $("selectorFechaHoraViaje"); if (existente) existente.remove();
  const ahora = new Date();
  const fechaHoy = `${ahora.getFullYear()}-${String(ahora.getMonth() + 1).padStart(2, "0")}-${String(ahora.getDate()).padStart(2, "0")}`;
  const modal = document.createElement("div");
  modal.id = "selectorFechaHoraViaje";
  Object.assign(modal.style, { position:"fixed", inset:"0", zIndex:"100000", background:"rgba(15,23,42,.72)", display:"flex", alignItems:"flex-end", justifyContent:"center", padding:"0", boxSizing:"border-box" });
  const panel = document.createElement("div");
  Object.assign(panel.style, { width:"100%", maxWidth:"430px", background:"#fff", color:"#10282c", borderRadius:"22px 22px 0 0", padding:"22px 22px calc(22px + env(safe-area-inset-bottom,0px))", boxSizing:"border-box", boxShadow:"0 -10px 40px rgba(0,0,0,.28)", fontFamily:"system-ui,sans-serif" });
  const titulo = document.createElement("h2"); titulo.textContent = "Fecha y hora del viaje";
  Object.assign(titulo.style, { margin:"0 0 6px", fontSize:"20px" });
  const ayuda = document.createElement("p"); ayuda.textContent = "Elige cuándo sales para consultar el tiempo y el tráfico.";
  Object.assign(ayuda.style, { margin:"0 0 16px", fontSize:"14px", color:"#5d706e" });

  function crearCampo(etiquetaTexto, tipo, valor, id) {
    const grupo = document.createElement("div"); grupo.style.marginBottom = "14px";
    const etiqueta = document.createElement("label"); etiqueta.htmlFor = id; etiqueta.textContent = etiquetaTexto;
    Object.assign(etiqueta.style, { display:"block", fontWeight:"700", fontSize:"14px", margin:"0 0 6px", color:"#10282c" });
    const campo = document.createElement("input"); campo.id = id; campo.type = tipo; campo.value = valor; campo.required = true;
    Object.assign(campo.style, { width:"100%", boxSizing:"border-box", padding:"12px", minHeight:"50px", border:"1px solid #dfe6e4", borderRadius:"12px", background:"#fff", color:"#10282c", fontSize:"16px", margin:"0" });
    campo.addEventListener("click", () => { try { if (typeof campo.showPicker === "function") campo.showPicker(); } catch (_) {} });
    grupo.append(etiqueta, campo);
    return { grupo, campo };
  }
  const fechaCampo = crearCampo("¿Qué fecha tiene el viaje?", "date", fechaInicial || fechaHoy, "selectorFechaViajeValor");
  const horaCampo = crearCampo("¿A qué hora sales?", "time", "08:00", "selectorHoraViajeValor");

  const acciones = document.createElement("div");
  Object.assign(acciones.style, { display:"flex", gap:"10px", marginTop:"6px" });
  const cancelar = document.createElement("button"); cancelar.type = "button"; cancelar.textContent = "Cancelar";
  const confirmar = document.createElement("button"); confirmar.type = "button"; confirmar.textContent = "Continuar";
  [cancelar, confirmar].forEach(b => Object.assign(b.style, { flex:"1", width:"auto", margin:"0", minHeight:"50px", border:"0", borderRadius:"12px", fontSize:"15px", fontWeight:"600", cursor:"pointer" }));
  cancelar.style.background = "#e6eceb"; cancelar.style.color = "#10282c";
  confirmar.style.background = "#7c3aed"; confirmar.style.color = "#fff";

  cancelar.addEventListener("click", () => modal.remove());
  confirmar.addEventListener("click", () => {
    const fecha = fechaCampo.campo.value, hora = horaCampo.campo.value;
    if (!fecha) { fechaCampo.campo.reportValidity(); return; }
    if (!hora) { horaCampo.campo.reportValidity(); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha) || Number.isNaN(Date.parse(`${fecha}T00:00:00`))) { alert("La fecha no es válida. Selecciona una fecha en el calendario."); return; }
    if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(hora)) { alert("La hora no es válida. Selecciona la hora en el reloj."); return; }
    modal.remove();
    onConfirm(fecha, hora); // desde el clic del usuario, para que el navegador no bloquee la pestaña nueva
  });
  acciones.append(cancelar, confirmar);
  panel.append(titulo, ayuda, fechaCampo.grupo, horaCampo.grupo, acciones);
  modal.appendChild(panel);
  modal.addEventListener("click", event => { if (event.target === modal) modal.remove(); });
  document.body.appendChild(modal);
}

window.consultarPrevisionViajes = function() {
  if (lastRouteCoords.length < 2 || !lastRouteOrigin || !lastListOrderClients.length) return alert("Primero crea una ruta para poder analizarla.");

  const routeChoice = window.prompt(
    "¿Cómo quieres analizar la ruta?\n\n" +
    "1 = Respetar el orden en que seleccionaste los clientes\n" +
    "2 = Ruta optimizada por eficiencia del recorrido\n\n" +
    "Escribe 1 o 2:", "2");
  if (routeChoice === null) return;
  if (routeChoice.trim() !== "1" && routeChoice.trim() !== "2") return alert("Opción no válida. Escribe 1 para respetar el orden o 2 para optimizar la ruta.");

  const routeMode = routeChoice.trim() === "1" ? "selection-order" : "optimized";
  const originAddress = currentStartOption === "manual" ? ($('startAddress').value.trim() || lastRouteOrigin.name) : lastRouteOrigin.name;
  let stops;

  if (routeMode === "selection-order") {
    stops = [
      { name: lastRouteOrigin.name, address: originAddress, lat: Number(lastRouteOrigin.lat), lon: Number(lastRouteOrigin.lng) },
      ...lastListOrderClients.map((client, index) => ({ name: client.name || client.address || `Parada ${index + 1}`, address: client.address || "", lat: Number(client.lat), lon: Number(client.lng) }))
    ];
  } else {
    stops = lastRouteCoords.map((coord, index) => {
      const client = index === 0 ? null : lastRouteClients[index - 1];
      return {
        name: index === 0 ? lastRouteOrigin.name : ((client && (client.name || client.address)) || `Parada ${index}`),
        address: index === 0 ? originAddress : ((client && client.address) || ""),
        lat: Number(coord[0]), lon: Number(coord[1])
      };
    });
  }

  if (stops.length < 2 || stops.some(stop => !Number.isFinite(stop.lat) || !Number.isFinite(stop.lon))) return alert("No se han podido preparar todas las paradas de la ruta. No se ha abierto Previsión Viajes.");

  const today = new Date();
  const localDate = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const fechaInicial = $('routeDate').value || localDate;

  mostrarSelectorFechaHora((date, departure) => {
    const payload = { version: 1, date, departure, routeMode, stops };
    let encoded;
    try {
      const bytes = new TextEncoder().encode(JSON.stringify(payload));
      let binary = ""; bytes.forEach(byte => binary += String.fromCharCode(byte));
      encoded = btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    } catch (error) {
      console.error("No se pudo preparar la ruta para Previsión Viajes", error);
      alert("No se ha podido preparar la ruta. No se ha abierto la otra aplicación."); return;
    }
    const target = "https://enlace386.github.io/Previsi-n-Viaje/#pv=" + encoded;
    const nuevaVentana = window.open(target, "_blank");
    if (!nuevaVentana) alert("El navegador ha bloqueado la nueva pestaña. Permite las ventanas emergentes para abrir Previsión Viajes.");
  }, fechaInicial);
};

async function cargarRutas(){
  if(!auth.currentUser) return;
  const q = query(collection(db, "rutas"), where("userId", "==", auth.currentUser.uid));
  const snapshot = await getDocs(q); const container = $('routeList'); container.innerHTML="";
  const rutas = snapshot.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => String(b.date||"").localeCompare(String(a.date||"")));
  if(!rutas.length) container.innerHTML = `<div class="empty">Todavía no has guardado rutas.</div>`;
  rutas.forEach(r => {
    let div=document.createElement('div'); div.className="routeItem";
    const n = (r.clients||[]).length;
    div.innerHTML=`<span>📅 ${esc(r.date || 'S/F')} · ${n} cliente${n===1?'':'s'}</span><button class="ib" aria-label="Cargar ruta" onclick="loadRoute('${r.id}')">👁️</button><button class="ib del" aria-label="Borrar ruta" onclick="deleteRoute('${r.id}')">🗑️</button>`;
    container.appendChild(div);
  });
}
